# Publikasi image ghcr.io/cmjcode/engram setiap tag vX.Y.Z (dirujuk server.json untuk MCP Registry).
name: Docker

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            io.modelcontextprotocol.server.name=io.github.cmjcode/engram
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Daftarkan versi baru ke MCP Registry resmi (login GitHub OIDC, tanpa secret tambahan).
  mcp-registry:
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Samakan versi server.json dengan tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          python3 - "$ver" <<'PY'
          import json, sys
          v = sys.argv[1]
          d = json.load(open("server.json"))
          d["version"] = v
          d["packages"][0]["identifier"] = f"ghcr.io/cmjcode/engram:{v}"
          json.dump(d, open("server.json", "w"), indent=2, ensure_ascii=False)
          PY
      - name: Pasang mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
      - name: Login (GitHub OIDC) & publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
