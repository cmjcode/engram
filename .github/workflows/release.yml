# Build & rilis aplikasi desktop (Windows + Linux) setiap ada tag vX.Y.Z.
# Build macOS (.dmg + notarisasi) dilakukan lokal lewat build.sh dan
# di-upload ke release yang sama.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek versi tag sama dengan Cargo.toml
        run: |
          want="${TAG#v}"
          have=$(awk -F'"' '/^\[/{s=($0=="[workspace.package]")} s && /^version *=/{print $2; exit}' Cargo.toml)
          if [ "$want" != "$have" ]; then
            echo "::error::Tag $TAG tidak cocok dengan versi Cargo.toml ($have)"
            exit 1
          fi

      - name: Buat release (kalau belum ada)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            files: target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            files: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Kosongkan ruang disk (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pasang dependensi sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config clang libclang-dev \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      - name: Pasang tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build bundle
        working-directory: apps/memory-desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Build CLI
        run: cargo build --release --locked -p memory-cli

      - name: Paket CLI (+ sha256)
        shell: bash
        run: |
          ver="${TAG#v}"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            name="memory-$ver-$target.zip"
            7z a "dist/$name" ./target/release/memory.exe
          else
            name="memory-$ver-$target.tar.gz"
            tar -czf "dist/$name" -C target/release memory
          fi
          (cd dist && sha256sum "$name" > "$name.sha256")
          ls -la dist

      - name: Upload ke GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la ${{ matrix.files }}
          gh release upload "$TAG" ${{ matrix.files }} dist/* -R "$GITHUB_REPOSITORY" --clobber
