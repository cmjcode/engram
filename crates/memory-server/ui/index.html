<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram</title>
<link rel="stylesheet" href="/app.css">
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<header class="top">
  <nav id="nav"></nav>
  <div class="subject">
    <label for="subject-select" class="sr">Subjek</label>
    <select id="subject-select"></select>
    <button id="new-subject" class="ghost" title="Subjek baru"><span data-icon="plus"></span></button>
    <button id="services-btn" hidden title="Status layanan"><span id="services-dot" class="dot"></span><span id="services-label">Layanan</span></button>
    <button id="data-sync" title="Lokasi data & sinkronisasi Google Drive"><span data-icon="cloud"></span><span>Data & Sync</span></button>
    <button id="connect-agents" title="Hubungkan agent AI (MCP)"><span data-icon="plug"></span><span>Agent AI</span></button>
    <button id="settings-btn" class="ghost" title="Pengaturan, tentang & update" aria-label="Pengaturan"><span data-icon="settings"></span><span id="update-dot" class="dot ok" hidden></span></button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><strong id="drawer-title"></strong><button id="drawer-close" class="ghost" title="Tutup"><span data-icon="x"></span></button></div>
  <div id="drawer-body"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
