<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram hub</title>
<link rel="icon" type="image/png" href="/logo.png">
<link rel="stylesheet" href="/app.css">
<script src="/i18n.js"></script>
<script>try { var theme = localStorage.getItem("theme"); if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme; } catch (e) {}</script>
</head>
<body class="hub-page">
<div class="content hub-content">
  <header class="top">
    <a class="brand" href="/hub#hub/repos"><img class="brand-mark" src="/logo.png" alt="" width="30" height="30"><span><b id="hub-name">engram hub</b><small data-i18n="team memory">team memory</small></span></a>
    <nav class="hub-nav" id="hub-nav" aria-label="Hub navigation" data-i18n-aria-label="Hub navigation"></nav>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>applyI18n();</script>
<script src="/hub.js"></script>
</body>
</html>
