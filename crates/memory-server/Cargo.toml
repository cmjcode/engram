[package]
name = "memory-server"
description = "HTTP API, server MCP (stdio & HTTP), dan UI web lokal."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ui", "hub"]
# UI web lokal (index.html, app.js, ...) di `/`. Aplikasi yang meng-embed engram
# (mis. OPERON) mematikannya: hanya `/api/*`, `/mcp`, `/api/health`.
ui = []
# Hub tim (`/hub/*`, `/api/hub/*`, tabel `hub_*`).
hub = ["memory-hub/server"]

[dependencies]
memory-core.workspace = true
memory-store.workspace = true
memory-llm.workspace = true
memory-extract.workspace = true
memory-retrieve.workspace = true
memory-jobs.workspace = true
memory-import.workspace = true
memory-hub = { workspace = true, default-features = false }
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
chrono.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
reqwest.workspace = true
toml.workspace = true
schemars.workspace = true
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
