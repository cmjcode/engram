[workspace]
resolver = "3"
members = ["crates/*", "apps/memory-cli", "apps/memory-desktop"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later OR LicenseRef-Engram-Commercial"
rust-version = "1.94"

[workspace.dependencies]
memory-core = { path = "crates/memory-core" }
memory-store = { path = "crates/memory-store" }
memory-llm = { path = "crates/memory-llm" }
memory-extract = { path = "crates/memory-extract" }
memory-retrieve = { path = "crates/memory-retrieve" }
memory-jobs = { path = "crates/memory-jobs" }
memory-import = { path = "crates/memory-import" }
memory-server = { path = "crates/memory-server" }
memory-hub = { path = "crates/memory-hub", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
blake3 = "1"
whatlang = "0.16"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls", "multipart"] }
surrealdb = { version = "4.0.1", default-features = false, features = ["kv-mem", "kv-surrealkv"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"
tempfile = "3"
futures = "0.3"
regex = "1"
unicode-normalization = "0.1"
age = "0.11"
tar = "0.4"
flate2 = "1"
rand = "0.9"
jsonwebtoken = "9"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
