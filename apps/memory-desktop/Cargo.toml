[package]
name = "memory-desktop"
description = "Aplikasi desktop mnemonic-memory (Tauri): mesin memori, worker, dan server MCP dalam satu aplikasi."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mnemonic-memory"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memory-core.workspace = true
memory-llm.workspace = true
memory-import.workspace = true
memory-jobs.workspace = true
memory-server.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
