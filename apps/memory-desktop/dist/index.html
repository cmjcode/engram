<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>engram</title>
<style>
  :root { --bg: #faf7f2; --ink: #2b2620; --muted: #776d62; --accent: #8a5a2b; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1916; --ink: #ece6dd; --muted: #a79d90; --accent: #e0a96d; --bad: #f2b8b5; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; padding: 24px; }
  h1 { color: var(--accent); font-size: 22px; }
  pre { white-space: pre-wrap; color: var(--bad); background: rgba(127,127,127,.12); padding: 12px; border-radius: 8px; }
  p { color: var(--muted); line-height: 1.55; }
</style>
</head>
<body>
<main>
  <h1>engram</h1>
  <div id="msg"><p>Menyiapkan memori...</p></div>
</main>
<script>
  // Diisi oleh aplikasi bila mesin memori gagal dijalankan.
  var err = window.__STARTUP_ERROR;
  if (err) {
    var box = document.getElementById("msg");
    box.innerHTML = "<p>Mesin memori tidak bisa dijalankan:</p><pre></pre>" +
      "<p>Periksa berkas konfigurasi di folder data aplikasi (menu ikon di menu bar, lalu Buka folder data), " +
      "lalu buka ulang aplikasi. Bila vault sedang dipakai perintah <code>memory serve</code>, hentikan dulu.</p>";
    box.querySelector("pre").textContent = err;
  }
</script>
</body>
</html>
