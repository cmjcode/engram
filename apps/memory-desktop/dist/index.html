<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <title>engram</title>
  <style>
    :root {
      --bg: #eef2f9;
      --bg-mesh:
        radial-gradient(at 15% 15%, rgba(90, 175, 255, 0.34) 0px, transparent 50%),
        radial-gradient(at 85% 20%, rgba(170, 135, 255, 0.28) 0px, transparent 50%),
        radial-gradient(at 75% 85%, rgba(75, 215, 235, 0.24) 0px, transparent 50%),
        linear-gradient(160deg, #f6f9fe 0%, #e7eef8 52%, #edf2fb 100%);
      --panel: linear-gradient(135deg, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.44) 100%);
      --line: rgba(255, 255, 255, 0.75);
      --ink: #1d1d1f;
      --muted: #5a6478;
      --accent: #0071e3;
      --bad: #dc2626;
      --shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.92), 0 16px 40px -10px rgba(15, 23, 42, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080b12;
        --bg-mesh:
          radial-gradient(at 15% 15%, rgba(10, 132, 255, 0.24) 0px, transparent 50%),
          radial-gradient(at 85% 20%, rgba(94, 92, 230, 0.22) 0px, transparent 50%),
          radial-gradient(at 75% 85%, rgba(48, 176, 199, 0.16) 0px, transparent 50%),
          linear-gradient(160deg, #0b101d 0%, #070a11 55%, #0c1220 100%);
        --panel: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
        --line: rgba(255, 255, 255, 0.15);
        --ink: #f5f5f7;
        --muted: #98a2b3;
        --accent: #2997ff;
        --bad: #ff453a;
        --shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.24), 0 20px 48px -10px rgba(0, 0, 0, 0.55);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      background-image: var(--bg-mesh);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 560px;
      padding: 28px 32px;
      background: var(--panel);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    h1 {
      color: var(--accent);
      font-size: 24px;
      letter-spacing: -0.025em;
      margin-top: 0;
    }

    pre {
      white-space: pre-wrap;
      color: var(--bad);
      background: rgba(127, 127, 127, 0.12);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
    }

    p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>engram</h1>
    <div id="msg">
      <p>Menyiapkan memori...</p>
    </div>
  </main>
  <script>
    // Diisi oleh aplikasi bila mesin memori gagal dijalankan.
    var err = window.__STARTUP_ERROR;
    if (err) {
      var box = document.getElementById("msg");
      box.innerHTML = "<p>Mesin memori tidak bisa dijalankan:</p><pre></pre>" +
        "<p>Periksa berkas konfigurasi di folder data aplikasi (menu ikon di menu bar, lalu Buka folder data), " +
        "lalu buka ulang aplikasi. Bila vault sedang dipakai perintah <code>engram serve</code>, hentikan dulu.</p>";
      box.querySelector("pre").textContent = err;
    }
  </script>
</body>

</html>
