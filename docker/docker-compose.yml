# Hub tim engram: memori proyek bersama + login Google/GitHub, di balik nginx yang sudah ada.
# Image dibangun dari source repo ini (Dockerfile di akar repo).
#
#   cp docker/hub.env.example docker/hub.env      # isi nilai-nilainya
#   docker compose -f docker/docker-compose.yml --env-file docker/hub.env up -d --build
#
# nginx (container) menjangkau engram lewat network Docker yang sama: isi NGINX_NETWORK dengan
# nama network container nginx Anda (`docker network ls`), lalu pakai docker/nginx-engram.conf
# (proxy_pass http://engram:7878). nginx yang berjalan di host: buka bagian `ports` di bawah dan
# proxy_pass ke http://127.0.0.1:7878.
#
# Daftarkan callback OAuth:
#   Google: https://<HUB_DOMAIN>/hub/auth/callback/google
#   GitHub: https://<HUB_DOMAIN>/hub/auth/callback/github
# Lalu tiap anggota: `engram login --hub https://<HUB_DOMAIN>` dan `engram repo init` / `join`.
services:
  engram:
    build:
      context: ..
      dockerfile: Dockerfile
    image: engram-hub:local
    container_name: engram
    restart: unless-stopped
    command: ["serve", "--bind", "0.0.0.0:7878", "--hub"]
    environment:
      ENGRAM_HUB_ENABLED: "1"
      ENGRAM_HUB_BASE_URL: "https://${HUB_DOMAIN}"
      # nginx meneruskan IP klien lewat X-Forwarded-For (pembatas laju & audit).
      ENGRAM_HUB_TRUST_PROXY: "1"
      ENGRAM_HUB_JWT_SECRET: "${ENGRAM_HUB_JWT_SECRET}"
      ENGRAM_HUB_GOOGLE_CLIENT_ID: "${ENGRAM_HUB_GOOGLE_CLIENT_ID:-}"
      ENGRAM_HUB_GOOGLE_SECRET: "${ENGRAM_HUB_GOOGLE_SECRET:-}"
      ENGRAM_HUB_GITHUB_CLIENT_ID: "${ENGRAM_HUB_GITHUB_CLIENT_ID:-}"
      ENGRAM_HUB_GITHUB_SECRET: "${ENGRAM_HUB_GITHUB_SECRET:-}"
      # Token admin API/MCP lokal server ini (bukan untuk anggota tim).
      MEMORY_TOKEN: "${MEMORY_TOKEN}"
    volumes:
      - engram-data:/data
    expose:
      - "7878"
    # nginx di host (bukan container): buka baris berikut.
    # ports:
    #   - "127.0.0.1:7878:7878"
    networks:
      - proxy

networks:
  proxy:
    name: ${NGINX_NETWORK:-proxy}
    external: true

volumes:
  engram-data:
