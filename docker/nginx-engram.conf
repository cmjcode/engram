# Blok server nginx untuk hub tim engram. Salin ke conf.d nginx Anda, ganti server_name dan
# path sertifikat, lalu `nginx -t && nginx -s reload`.
# Container nginx harus satu network dengan container `engram` (NGINX_NETWORK di docker/hub.env).

server {
    listen 80;
    server_name engram.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name engram.example.com;

    ssl_certificate     /etc/nginx/certs/engram.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/engram.example.com/privkey.pem;

    # Push memori bisa sampai beberapa MB (batas hub 8 MiB per permintaan).
    client_max_body_size 10m;

    location / {
        proxy_pass http://engram:7878;    # nginx di host: http://127.0.0.1:7878
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # engram (ENGRAM_HUB_TRUST_PROXY=1) memakai hop pertama header ini sebagai IP klien.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Endpoint MCP memakai SSE (stream panjang): jangan di-buffer.
    location /mcp {
        proxy_pass http://engram:7878;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
